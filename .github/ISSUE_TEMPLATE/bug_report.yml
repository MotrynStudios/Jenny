name: Bug report
description: Report a reproducible problem with Jenny.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, private user data, and private modpack contents before posting.
  - type: input
    id: version
    attributes:
      label: Jenny version or commit
      placeholder: 0.85 or commit SHA
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Python and Node versions
      placeholder: Python 3.12, Node 22.12
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include steps to reproduce and expected behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error excerpt
      description: Remove tokens, keys, message contents, and server identifiers.
