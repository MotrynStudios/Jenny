name: Validate source syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Python and Node syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Compile Python source
        run: python -m compileall -q Jenny jenny_api_server.py jenny_rag_integration.py tools
      - name: Check voice service syntax
        run: node --check voice_service/index.js
